# Docker Compose automatically loads .env file from the same directory
# Copy .env.example to .env and configure your settings

services:
  # GameRequest Application
  ggrequestz:
    # Use pre-built image by default, fall back to local build if needed
    image: ghcr.io/xtreemmak/ggrequestz:latest
    build:
      context: .
      args:
        - PUID=${PUID:-1000}
        - PGID=${PGID:-1000}
    container_name: ggrequestz-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # User/Group IDs for file permissions
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}

      # Database Configuration
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Per PM2 worker — the real ceiling is this times your core count
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-10}

      # Authentication
      AUTH_METHOD: ${AUTH_METHOD}
      # Generic OIDC (any standards-compliant provider)
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-}
      OIDC_ROLE_MAP: ${OIDC_ROLE_MAP:-}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      # Manual endpoints for providers without a discovery document
      OIDC_AUTH_URL: ${OIDC_AUTH_URL:-}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-}
      OIDC_USERINFO_URL: ${OIDC_USERINFO_URL:-}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      OIDC_END_SESSION_URL: ${OIDC_END_SESSION_URL:-}
      # Legacy aliases, still honoured for existing Authentik installs
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:-}
      SESSION_SECRET: ${SESSION_SECRET}

      # IGDB API (required)
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}

      # Redis Cache (optional - falls back to memory if not available)
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      # Optional External Services
      GOTIFY_URL: ${GOTIFY_URL:-}
      GOTIFY_TOKEN: ${GOTIFY_TOKEN:-}
      ROMM_SERVER_URL: ${ROMM_SERVER_URL:-}
      # RomM 5.0+ Client API Token (preferred; needs the roms.read scope)
      ROMM_API_TOKEN: ${ROMM_API_TOKEN:-}
      # Password-grant fallback for RomM 4.x
      ROMM_USERNAME: ${ROMM_USERNAME:-}
      ROMM_PASSWORD: ${ROMM_PASSWORD:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}

      # Application Configuration
      PM2_INSTANCES: ${PM2_INSTANCES:-max}
      PM2_CRON_RESTART: ${PM2_CRON_RESTART:-}
      NODE_ENV: production
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      # Tells adapter-node the app's public URL. Without it adapter-node assumes
      # https, which breaks CSRF origin checks and OIDC redirect URIs on http
      # deployments. Derived from PUBLIC_SITE_URL by the entrypoint if unset.
      ORIGIN: ${ORIGIN:-}
    volumes:
      - ggrequestz-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ggrequestz-network
    healthcheck:
      test: ["CMD", "node", "/app/scripts/healthcheck.cjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ggrequestz-postgres
    restart: unless-stopped
    # Local PostgreSQL for testing
    environment:
      POSTGRES_DB: ggrequestz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    networks:
      - ggrequestz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ggrequestz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ggrequestz-redis
    restart: unless-stopped
    # Local Redis cache for testing
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      REDIS_REPLICATION_MODE: master
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_EXTERNAL_PORT:-6380}:6379"
    networks:
      - ggrequestz-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  ggrequestz-logs:
    driver: local

networks:
  ggrequestz-network:
    driver: bridge
    name: ggrequestz-network
