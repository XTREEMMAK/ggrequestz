name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      # Server-side tests, run against a mocked fetch. No services required.
      - name: Run integration tests
        run: npm run test:integration

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ggrequestz_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Setup test environment
        run: |
          cp .env.example .env
          echo "POSTGRES_HOST=localhost" >> .env
          echo "POSTGRES_PORT=5432" >> .env
          echo "POSTGRES_DB=ggrequestz_test" >> .env
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=test_password" >> .env
          echo "SESSION_SECRET=test_session_secret_for_github_actions_32_chars" >> .env
          echo "IGDB_CLIENT_ID=test_client_id" >> .env
          echo "IGDB_CLIENT_SECRET=test_client_secret" >> .env
          echo "AUTH_METHOD=basic" >> .env
          echo "NODE_ENV=test" >> .env

      - name: Clear database and run migrations
        run: |
          # Clear any existing data and reset migrations
          PGPASSWORD=test_password psql -h localhost -U postgres -d ggrequestz_test -c "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO postgres; GRANT ALL ON SCHEMA public TO public;"
          # Remove .env file temporarily to prevent dotenv override
          mv .env .env.backup || true
          # Run migrations with environment variables
          node scripts/database/db-manager.js migrate
          # Restore .env file
          mv .env.backup .env || true
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: ggrequestz_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password

      - name: Build application
        run: npm run build

      # The admin first, then the fixtures: the order `make test-seeded` uses.
      # First-run setup only opens on an instance with no account at all
      # (GHSA-xm2w-327g-3fxg), so seeding the demo accounts first would close it
      # and leave the suite without the admin it signs in as. The built app is
      # started just long enough for seed-app.sh to use that endpoint, then
      # stopped, so Playwright can start its own on the same port.
      - name: Create the admin through first-run setup
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          PREVIEW_PID=$!
          ./scripts/testing/seed-app.sh http://localhost:4173 || { cat preview.log; exit 1; }
          kill "$PREVIEW_PID"
          wait "$PREVIEW_PID" 2>/dev/null || true
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: ggrequestz_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          SESSION_SECRET: test_session_secret_for_github_actions_32_chars
          IGDB_CLIENT_ID: test_client_id
          IGDB_CLIENT_SECRET: test_client_secret
          AUTH_METHOD: basic
          NODE_ENV: test

      # The e2e suite asserts on the seeded library (30 games, requests,
      # watchlist). Migrations create the schema and nothing else, so without
      # this those assertions have no data to find. seed-data.js is offline and
      # idempotent by design: no IGDB, ROMM or OIDC credentials needed. The
      # admin comes from the step above.
      - name: Seed test fixtures
        run: node scripts/testing/seed-data.js
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: ggrequestz_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  lint-and-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run lint

      - name: Run Svelte check
        run: npm run check
